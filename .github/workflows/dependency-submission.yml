name: Dependency Submission

on:
  push:
    branches: [main, dependency-automation-trial]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  submit-gradle-dependencies:
    if: >-
      ${{
        (github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) ||
        (github.ref == 'refs/heads/dependency-automation-trial' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'schedule' && vars.DEPENDENCY_AUTOMATION_TRIAL_SCHEDULES_ENABLED == 'true')))
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Verify complete trial dependency resolution
        if: ${{ github.ref == 'refs/heads/dependency-automation-trial' }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p dependency-automation-evidence
          ./gradlew --no-daemon --no-configuration-cache build 2>&1 \
            | tee dependency-automation-evidence/dependency-resolution.log

      - name: Generate and submit dependency graph
        id: dependency-graph
        uses: gradle/actions/dependency-submission@v6
        with:
          cache-provider: basic
          cache-disabled: ${{ github.ref == 'refs/heads/dependency-automation-trial' && vars.DEPENDENCY_AUTOMATION_TRIAL_CACHES_ENABLED != 'true' }}
          dependency-graph: >-
            ${{
              github.ref == 'refs/heads/main' && 'generate-and-submit' ||
              (vars.DEPENDENCY_AUTOMATION_TRIAL_GRAPH_SUBMISSION_ENABLED == 'true' &&
                github.ref_name == github.event.repository.default_branch && 'generate-and-submit' || 'generate')
            }}
          dependency-graph-report-dir: dependency-automation-evidence/dependency-graph
          additional-arguments: --no-configuration-cache

      - name: Measure complete trial dependency-graph evidence
        id: trial-evidence
        if: ${{ always() && github.ref == 'refs/heads/dependency-automation-trial' }}
        run: >-
          bash .github/scripts/prepare-trial-evidence.sh
          dependency-automation-evidence/dependency-graph-evidence.tar.gz
          'Trial dependency graph'
          dependency-automation-evidence/dependency-resolution.log
          dependency-automation-evidence/dependency-graph

      - name: Upload capped trial dependency-graph evidence
        if: >-
          ${{
            always() && vars.DEPENDENCY_AUTOMATION_TRIAL_UPLOADS_ENABLED == 'true' &&
            steps.trial-evidence.outputs.upload_allowed == 'true'
          }}
        uses: actions/upload-artifact@v7
        with:
          name: trial-dependency-graph-evidence-${{ github.run_id }}
          path: dependency-automation-evidence/dependency-graph-evidence.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Enforce complete trial dependency-graph evidence delivery
        if: >-
          ${{
            always() && vars.DEPENDENCY_AUTOMATION_TRIAL_UPLOADS_ENABLED == 'true' &&
            steps.trial-evidence.outputs.upload_allowed != 'true'
          }}
        run: |
          echo 'The complete trial dependency-graph evidence exceeds the capped upload allowance.' >&2
          exit 1
