name: Build

on:
  push:
    branches: [main, dependency-automation-trial]
  pull_request:
    branches: [main, dependency-automation-trial]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    if: >-
      ${{
        ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dependency-automation-trial')) ||
        (github.event_name == 'pull_request' &&
          (github.base_ref == 'main' || github.base_ref == 'dependency-automation-trial'))
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: >-
            ${{
              (github.ref == 'refs/heads/dependency-automation-trial' ||
                github.base_ref == 'dependency-automation-trial') &&
              vars.DEPENDENCY_AUTOMATION_TRIAL_CACHES_ENABLED != 'true'
            }}

      - name: Build with Gradle
        shell: bash
        run: |
          set -o pipefail
          mkdir -p dependency-automation-evidence
          ./gradlew build 2>&1 | tee dependency-automation-evidence/build.log

      - name: Upload test results
        if: ${{ always() && (github.ref == 'refs/heads/main' || github.base_ref == 'main') }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: '**/build/test-results/test/*.xml'
          retention-days: 7

      - name: Upload build artifacts
        if: ${{ github.ref == 'refs/heads/main' || github.base_ref == 'main' }}
        uses: actions/upload-artifact@v7
        with:
          name: jars
          path: '**/build/libs/*.jar'
          retention-days: 7

      - name: Publish to Maven Local
        run: ./gradlew publishToMavenLocal

      - name: Measure complete trial build evidence
        id: trial-evidence
        if: >-
          ${{
            always() &&
            (github.ref == 'refs/heads/dependency-automation-trial' ||
              (github.event_name == 'pull_request' && github.base_ref == 'dependency-automation-trial'))
          }}
        run: >-
          bash .github/scripts/prepare-trial-evidence.sh
          dependency-automation-evidence/build-evidence.tar.gz
          'Trial build'
          dependency-automation-evidence/build.log
          spring-platform/build/libs
          spring-platform/build/test-results/test
          spring-cloud-platform/build/libs
          spring-cloud-platform/build/test-results/test
          service-core/build/libs
          service-core/build/test-results/test
          service-web/build/libs
          service-web/build/test-results/test

      - name: Upload capped trial build evidence
        if: >-
          ${{
            always() && vars.DEPENDENCY_AUTOMATION_TRIAL_UPLOADS_ENABLED == 'true' &&
            steps.trial-evidence.outputs.upload_allowed == 'true'
          }}
        uses: actions/upload-artifact@v7
        with:
          name: trial-build-evidence-${{ github.run_id }}
          path: dependency-automation-evidence/build-evidence.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Enforce complete trial build evidence delivery
        if: >-
          ${{
            always() && vars.DEPENDENCY_AUTOMATION_TRIAL_UPLOADS_ENABLED == 'true' &&
            steps.trial-evidence.outputs.upload_allowed != 'true'
          }}
        run: |
          echo 'The complete trial build evidence exceeds the capped upload allowance.' >&2
          exit 1
