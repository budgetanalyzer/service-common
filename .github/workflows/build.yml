name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: |
            **/build/test-results/*/*.xml
            **/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 7

      - name: Generate publication metadata
        if: always()
        run: ./gradlew generatePomFileForMavenJavaPublication generateMetadataFileForMavenJavaPublication

      - name: Upload publication metadata
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: publication-metadata
          path: |
            **/build/publications/mavenJava/pom-default.xml
            **/build/publications/mavenJava/module.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: jars
          path: '**/build/libs/*.jar'
          retention-days: 7

      - name: Publish to Maven Local
        run: ./gradlew publishToMavenLocal
