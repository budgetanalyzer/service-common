[versions]
java = "25"
springBoot = "4.1.2"
springCloud = "2025.1.4"
springModulith = "2.1.2"
spotless = "8.10.4"
checkstyle = "12.3.1"
googleJavaFormat = "1.32.0"
jacoco = "0.8.15"
opencsv = "5.12.0"
springdoc = "3.2.0"
wiremock = "3.13.2"
awaitility = "4.3.0"
shedlock = "7.10.1"

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

[libraries]
# Spring Boot starters (versions managed by Spring Boot BOM)
spring-boot-starter-webmvc = { module = "org.springframework.boot:spring-boot-starter-webmvc" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-webflux-test = { module = "org.springframework.boot:spring-boot-starter-webflux-test" }
spring-boot-starter-security-test = { module = "org.springframework.boot:spring-boot-starter-security-test" }
spring-boot-starter-data-jpa-test = { module = "org.springframework.boot:spring-boot-starter-data-jpa-test" }
spring-security-core = { module = "org.springframework.security:spring-security-core" }
spring-security-test = { module = "org.springframework.security:spring-security-test" }

# Jackson (versions managed by Spring Boot BOM)
jackson-databind = { module = "tools.jackson.core:jackson-databind" }

# Logging (versions managed by Spring Boot BOM)
slf4j-api = { module = "org.slf4j:slf4j-api" }

# Apache Commons (versions managed by Spring Boot BOM)
commons-lang3 = { module = "org.apache.commons:commons-lang3" }

# Third-party libraries with explicit versions
opencsv = { module = "com.opencsv:opencsv", version.ref = "opencsv" }
springdoc-openapi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
springdoc-openapi-webflux = { module = "org.springdoc:springdoc-openapi-starter-webflux-ui", version.ref = "springdoc" }

# Observability (versions managed by Spring Boot BOM)
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }

# Test dependencies
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
h2 = { module = "com.h2database:h2" }
